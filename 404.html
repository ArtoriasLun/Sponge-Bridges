<script>
(function(){
  var LANGS = [
    {code:'en', label:'EN'},
    {code:'zh', label:'中文'}
  ];
  var I18N = { en: NF_I18N_EN, zh: NF_I18N_ZH };

  function applyLang(lang){
    var dict = I18N[lang] || I18N.en;
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var key = el.getAttribute('data-i18n');
      var val = (key in dict) ? dict[key] : I18N.en[key];
      if (val != null) el.textContent = val;
    });
    document.querySelectorAll('[data-i18n-html]').forEach(function(el){
      var key = el.getAttribute('data-i18n-html');
      var val = (key in dict) ? dict[key] : I18N.en[key];
      if (val != null) el.innerHTML = val;
    });
    document.querySelectorAll('#langsw button').forEach(function(b){
      b.classList.toggle('active', b.dataset.lang === lang);
    });
    try { localStorage.setItem('sb_lang', lang); } catch (e) {}
  }

  function detectLang(){
    try {
      var saved = localStorage.getItem('sb_lang');
      if (saved && I18N[saved]) return saved;
    } catch (e) {}
    var nav = (navigator.language || 'en').toLowerCase();
    if (nav.indexOf('zh') === 0) return 'zh';
    return 'en';
  }

  var sw = document.getElementById('langsw');
  LANGS.forEach(function(l){
    var b = document.createElement('button');
    b.type = 'button';
    b.dataset.lang = l.code;
    b.textContent = l.label;
    b.addEventListener('click', function(){ applyLang(l.code); });
    sw.appendChild(b);
  });
  applyLang(detectLang());
})();
</script>
