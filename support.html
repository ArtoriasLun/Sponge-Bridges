<title>Sponge Bridges — Support</title>
<meta name="description" content="Contact support for Sponge Bridges.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600;9..144,900&family=Archivo:wght@400;500;600&family=Share+Tech+Mono&display=swap">
<style>
  :root{
    --bg:#0c0a16; --bg2:#050409;
    --glass:#3fd6c9; --glass-dim:rgba(63,214,201,.18); --glass-line:rgba(63,214,201,.32);
    --fire:#f2954a; --fire-dim:#c65a2e;
    --ink:#f3ede0; --ink-dim:rgba(243,237,224,.62); --ink-faint:rgba(243,237,224,.34);
    --line:rgba(243,237,224,.14);
    --display:'Fraunces','Noto Serif SC',serif;
    --body:'Archivo','Noto Sans SC',sans-serif;
    --mono:'Share Tech Mono','Noto Sans SC',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(63,214,201,.08), transparent 60%),
      radial-gradient(700px 500px at 100% 0%, rgba(242,149,74,.06), transparent 55%),
      var(--bg);
    color:var(--ink); font-family:var(--body); min-height:100svh;
  }
  ::selection{background:var(--glass);color:var(--bg2)}

  nav{
    display:flex; justify-content:space-between; align-items:center;
    padding:20px clamp(18px,4vw,40px); border-bottom:1px solid var(--line);
  }
  nav a.mark{font-family:var(--mono); font-size:12.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink); text-decoration:none}
  nav a.back{
    font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--ink-faint); text-decoration:none; border:1px solid var(--line); padding:6px 13px;
    transition:color .25s ease, border-color .25s ease;
  }
  nav a.back:hover{color:var(--glass); border-color:var(--glass-line)}
  nav .navright{display:flex; align-items:center; gap:12px}
  nav .langsw{display:flex; border:1px solid var(--line)}
  nav .langsw button{
    font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--ink-faint); background:transparent; border:none; padding:6px 11px; cursor:pointer;
    transition:color .25s ease, background .25s ease;
  }
  nav .langsw button+button{border-left:1px solid var(--line)}
  nav .langsw button:hover{color:var(--ink)}
  nav .langsw button.active{color:var(--glass); background:var(--glass-dim)}

  main{max-width:640px; margin:0 auto; padding:clamp(48px,9vh,96px) clamp(18px,5vw,24px) 100px}
  .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:var(--fire); margin-bottom:16px}
  h1{
    font-family:var(--display); font-weight:900; font-size:clamp(38px,7vw,64px);
    line-height:1; letter-spacing:-.01em; margin-bottom:18px; text-wrap:balance;
  }
  .lede{color:var(--ink-dim); font-size:15.5px; line-height:1.75; max-width:38em; margin-bottom:44px}
  .lede em{font-style:italic; color:var(--glass)}

  .embed{position:relative; border:1px solid var(--line); padding:clamp(10px,2vw,16px)}
  .embed::before,.embed::after{content:"";position:absolute;top:0;width:11px;height:11px}
  .embed::before{left:0;border-top:1px solid var(--glass);border-left:1px solid var(--glass)}
  .embed::after{right:0;border-top:1px solid var(--glass);border-right:1px solid var(--glass)}
  .embed iframe{width:100%; height:920px; border:0; display:block; background:transparent; color-scheme:light}
  @media(max-width:520px){ .embed iframe{height:1080px} }

  footer{
    padding:26px clamp(18px,6vw,40px) 36px; display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap:10px; color:var(--ink-faint); font-family:var(--mono); font-size:10.5px;
    letter-spacing:.06em; border-top:1px solid var(--line);
  }
</style>

<nav>
  <a class="mark" href="index.html">Sponge Bridges</a>
  <div class="navright">
    <a class="back" href="index.html" data-i18n="nav.back">← Home</a>
    <div class="langsw" id="langsw"></div>
  </div>
</nav>

<main>
  <div class="eyebrow" data-i18n="eyebrow">Contact Support</div>
  <h1 data-i18n-html="h1">Need a hand<br>through the fog?</h1>
  <p class="lede" data-i18n-html="lede">Tell us what's going on and we'll get back to you. <em>Be as specific as you can</em> — your system, what you were doing, what happened instead.</p>

  <div class="embed">
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLScIH3ZMvVJHEZaWgAKNKO2k2Tu1fYbCq2GABO_apDCmsG12KQ/viewform?embedded=true" title="Sponge Bridges support form">Loading…</iframe>
  </div>
</main>

<footer>
  <span>Sponge Bridges</span>
  <span>© 2026</span>
</footer>

<script>
(function(){
  var LANGS = [
    {code:'en', label:'EN'},
    {code:'zh', label:'中文'}
  ];
  var I18N = {
    en: {
      'nav.back':'← Home',
      'eyebrow':'Contact Support',
      'h1':'Need a hand<br>through the fog?',
      'lede':'Tell us what\'s going on — your system, what you were doing, what happened instead. <em>One issue per line</em> if you\'re reporting more than one.'
    },
    zh: {
      'nav.back':'← 返回首页',
      'eyebrow':'联系支持',
      'h1':'迷雾之中，<br>需要帮助吗？',
      'lede':'把你遇到的情况写清楚提交给我们——你的系统环境、当时在做什么、结果和预期有什么不同。<em>一条问题写一行</em>，如果不止一个问题的话。'
    }
  };

  function applyLang(lang){
    var dict = I18N[lang] || I18N.en;
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var key = el.getAttribute('data-i18n');
      var val = dict[key] || I18N.en[key];
      if (val) el.textContent = val;
    });
    document.querySelectorAll('[data-i18n-html]').forEach(function(el){
      var key = el.getAttribute('data-i18n-html');
      var val = dict[key] || I18N.en[key];
      if (val) el.innerHTML = val;
    });
    document.querySelectorAll('#langsw button').forEach(function(b){
      b.classList.toggle('active', b.dataset.lang === lang);
    });
    try { localStorage.setItem('sb_lang', lang); } catch (e) {}
  }

  function detectLang(){
    try {
      var saved = localStorage.getItem('sb_lang');
      if (saved && I18N[saved]) return saved;
    } catch (e) {}
    var nav = (navigator.language || 'en').toLowerCase();
    if (nav.indexOf('zh') === 0) return 'zh';
    return 'en';
  }

  var sw = document.getElementById('langsw');
  LANGS.forEach(function(l){
    var b = document.createElement('button');
    b.type = 'button';
    b.dataset.lang = l.code;
    b.textContent = l.label;
    b.addEventListener('click', function(){ applyLang(l.code); });
    sw.appendChild(b);
  });
  applyLang(detectLang());
})();
</script>
